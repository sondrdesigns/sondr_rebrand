<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 26px 40px; background: var(--paper);
    background-image: radial-gradient(var(--dot) var(--dot-size), transparent var(--dot-size));
    background-size: var(--grid-pitch) var(--grid-pitch); }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { NavItem, SondrIcon } = window.SondrDesignsDesignSystem_41b26a;
    const ICONS = ['works', 'blog', 'contact', 'studio', 'interior'];
    function Demo() {
      return (
        <div>
          <nav style={{ display: 'flex', gap: 36, alignItems: 'center' }}>
            <NavItem current>works</NavItem>
            <NavItem>blog</NavItem>
            <NavItem>mission</NavItem>
            <NavItem>interior dept.</NavItem>
            <NavItem>contact</NavItem>
          </nav>
          <div style={{ display: 'flex', gap: 30, alignItems: 'center', marginTop: 34 }}>
            {ICONS.map((n) => (
              <span key={n} className="sondr-icon" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8, fontFamily: 'var(--font-mono)', fontSize: 12, letterSpacing: '.08em', cursor: 'pointer' }}>
                <SondrIcon name={n} size={30} />{n}
              </span>
            ))}
          </div>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '.06em', color: 'var(--ink-soft)', marginTop: 16 }}>hover an icon to animate it</div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
