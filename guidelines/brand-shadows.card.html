<!-- @dsCard group="Brand" viewport="700x140" name="Shadows" subtitle="Sticky lift, tape, and soft float shadows" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); display: flex; align-items: center; gap: 48px; padding: 0 40px; height: 140px; box-sizing: border-box; font-family: var(--font-mono); }
  .item { text-align: center; }
  .chip { width: 120px; height: 60px; background: var(--paper-white); margin-bottom: 12px; }
  .cap { font-size: 11px; letter-spacing: .05em; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="item"><div class="chip" style="box-shadow: var(--shadow-sticky)"></div><div class="cap">shadow-sticky</div></div>
  <div class="item"><div class="chip" style="box-shadow: var(--shadow-tape)"></div><div class="cap">shadow-tape</div></div>
  <div class="item"><div class="chip" style="box-shadow: var(--shadow-lift)"></div><div class="cap">shadow-lift</div></div>
</body>
</html>
