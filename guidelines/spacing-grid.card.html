<!-- @dsCard group="Spacing" viewport="700x180" name="Dotted grid & margin" subtitle="28px dot pitch, 2px dots, 180px left margin rule" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); }
  .page {
    position: relative; height: 180px;
    background-color: var(--paper);
    background-image: radial-gradient(var(--dot) var(--dot-size), transparent var(--dot-size));
    background-size: var(--grid-pitch) var(--grid-pitch);
  }
  .rule { position: absolute; top: 0; bottom: 0; left: 120px; border-left: 1.5px solid var(--rule-color); }
  .label { position: absolute; left: 140px; top: 22px; font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; color: var(--ink); line-height: 1.7; }
</style>
</head>
<body>
  <div class="page">
    <div class="rule"></div>
    <div class="label">grid-pitch 28px<br>dot-size 2px<br>margin-rule 180px (shown @120)</div>
  </div>
</body>
</html>
