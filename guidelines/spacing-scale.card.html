<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="8 · 14 · 28 · 56 · 84 · 120px" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--paper); font-family: var(--font-mono); box-sizing: border-box; }
  .track { display: flex; align-items: flex-end; gap: 18px; height: 96px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--ink); width: 100%; }
  .cap { font-size: 11px; letter-spacing: .05em; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="track">
    <div class="item" style="width:8px"><div class="bar" style="height:8px"></div></div>
    <div class="item" style="width:14px"><div class="bar" style="height:14px"></div></div>
    <div class="item" style="width:28px"><div class="bar" style="height:28px"></div></div>
    <div class="item" style="width:56px"><div class="bar" style="height:56px"></div></div>
    <div class="item" style="width:84px"><div class="bar" style="height:84px"></div></div>
    <div class="item" style="width:120px"><div class="bar" style="height:96px"></div></div>
  </div>
  <div class="cap" style="margin-top:12px">8 · 14 · 28 · 56 · 84 · 120 &nbsp;— base unit = 28px (one grid cell)</div>
</body>
</html>
