<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 28px; background: var(--paper); box-sizing: border-box; font-family: var(--font-mono); letter-spacing: .11em; color: var(--ink); }
  .lead { font-size: 20px; line-height: 1.4; }
  .body { font-size: 15px; line-height: 1.55; margin-top: 10px; }
  .small { font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
</style>
</head>
<body>
  <div class="lead">we help businesses grow — 20px lead</div>
  <div class="body">running body copy in intel one mono, tracked 0.11em for the notebook feel. 15px / line-height 1.55.</div>
  <div class="small">fine print · captions · labels — 13px muted</div>
</body>
</html>
