<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520">

  <!-- Background: warm grey-beige -->
  <rect width="400" height="520" fill="#e8ddd4"/>

  <!-- City block map — minimal road grid -->
  <!-- Horizontal road 1 -->
  <rect x="0" y="176" width="400" height="18" fill="#d4c8be" stroke="none"/>
  <line x1="0" y1="185" x2="400" y2="185" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="8 6" opacity="0.3"/>
  <!-- Horizontal road 2 -->
  <rect x="0" y="316" width="400" height="18" fill="#d4c8be" stroke="none"/>
  <line x1="0" y1="325" x2="400" y2="325" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="8 6" opacity="0.3"/>
  <!-- Vertical road 1 -->
  <rect x="128" y="0" width="18" height="520" fill="#d4c8be" stroke="none"/>
  <line x1="137" y1="0" x2="137" y2="520" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="8 6" opacity="0.3"/>
  <!-- Vertical road 2 -->
  <rect x="274" y="0" width="18" height="520" fill="#d4c8be" stroke="none"/>
  <line x1="283" y1="0" x2="283" y2="520" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="8 6" opacity="0.3"/>
  <!-- Road outlines — block edges -->
  <line x1="0" y1="176" x2="400" y2="176" stroke="#1a1a1a" stroke-width="1.4" opacity="0.25"/>
  <line x1="0" y1="194" x2="400" y2="194" stroke="#1a1a1a" stroke-width="1.4" opacity="0.25"/>
  <line x1="0" y1="316" x2="400" y2="316" stroke="#1a1a1a" stroke-width="1.4" opacity="0.25"/>
  <line x1="0" y1="334" x2="400" y2="334" stroke="#1a1a1a" stroke-width="1.4" opacity="0.25"/>
  <line x1="128" y1="0" x2="128" y2="520" stroke="#1a1a1a" stroke-width="1.4" opacity="0.25"/>
  <line x1="146" y1="0" x2="146" y2="520" stroke="#1a1a1a" stroke-width="1.4" opacity="0.25"/>
  <line x1="274" y1="0" x2="274" y2="520" stroke="#1a1a1a" stroke-width="1.4" opacity="0.25"/>
  <line x1="292" y1="0" x2="292" y2="520" stroke="#1a1a1a" stroke-width="1.4" opacity="0.25"/>

  <!-- Main café pin — center block, brown, coffee cup shape -->
  <!-- Pin body / teardrop -->
  <path d="M 200 120 C 222 120, 240 138, 240 160 C 240 190, 200 228, 200 228 C 200 228, 160 190, 160 160 C 160 138, 178 120, 200 120 Z"
    fill="#B5621E" stroke="#1a1a1a" stroke-width="2.4"/>
  <!-- Coffee cup icon inside pin -->
  <rect x="187" y="146" width="26" height="22" rx="3" fill="#f5ede2" stroke="#1a1a1a" stroke-width="1.4"/>
  <!-- Cup handle -->
  <path d="M 213 151 Q 222 151 222 157 Q 222 163 213 163"
    fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Coffee surface in cup -->
  <ellipse cx="200" cy="149" rx="11" ry="4" fill="#7a4f28" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Secondary pin — upper-left block, blueprint blue -->
  <!-- Pin body -->
  <path d="M 84 90 C 96 90, 106 100, 106 114 C 106 132, 84 156, 84 156 C 84 156, 62 132, 62 114 C 62 100, 72 90, 84 90 Z"
    fill="#0051FF" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Pin dot -->
  <circle cx="84" cy="114" r="5" fill="#e8ddd4"/>

  <!-- Tertiary pin — lower-right block, ink -->
  <!-- Pin body -->
  <path d="M 330 368 C 339 368, 346 375, 346 385 C 346 398, 330 414, 330 414 C 330 414, 314 398, 314 385 C 314 375, 321 368, 330 368 Z"
    fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Pin dot -->
  <circle cx="330" cy="385" r="4" fill="#e8ddd4"/>

  <!-- "blend" wordmark — small lowercase italic, bottom center -->
  <text x="200" y="478"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18" font-style="italic"
    fill="#1a1a1a" text-anchor="middle"
    letter-spacing="2" opacity="0.45">blend</text>

</svg>
