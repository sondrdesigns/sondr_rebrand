<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520">

  <!-- Background: warm sand -->
  <rect width="400" height="520" fill="#f0dcc4"/>

  <!-- Green arc band — sweeps across top, referencing LNC logo -->
  <path d="M 0 96 Q 200 40, 400 96 L 400 0 L 0 0 Z"
    fill="#1DA344"/>

  <!-- Produce crate — flat overhead view, centered -->
  <!-- Crate outer rectangle -->
  <rect x="68" y="168" width="264" height="244" rx="6"
    fill="#c49a6c" stroke="#1a1a1a" stroke-width="2.8"/>
  <!-- Wood grain detail — horizontal slat lines -->
  <line x1="68" y1="229" x2="332" y2="229" stroke="#1a1a1a" stroke-width="1.4" opacity="0.4"/>
  <line x1="68" y1="290" x2="332" y2="290" stroke="#1a1a1a" stroke-width="1.4" opacity="0.4"/>
  <line x1="68" y1="351" x2="332" y2="351" stroke="#1a1a1a" stroke-width="1.4" opacity="0.4"/>
  <!-- Corner reinforcement details -->
  <rect x="68" y="168" width="18" height="18" fill="#1a1a1a" opacity="0.18" rx="2"/>
  <rect x="314" y="168" width="18" height="18" fill="#1a1a1a" opacity="0.18" rx="2"/>
  <rect x="68" y="394" width="18" height="18" fill="#1a1a1a" opacity="0.18" rx="2"/>
  <rect x="314" y="394" width="18" height="18" fill="#1a1a1a" opacity="0.18" rx="2"/>

  <!-- Carrot — upper left quadrant, diagonal -->
  <path d="M 128 210 Q 118 228, 126 252 Q 134 276, 128 296"
    fill="none" stroke="#E8834A" stroke-width="12" stroke-linecap="round"/>
  <!-- Carrot top leaves -->
  <path d="M 128 210 Q 112 192, 106 178" fill="none" stroke="#1DA344" stroke-width="3" stroke-linecap="round"/>
  <path d="M 128 210 Q 120 190, 128 174" fill="none" stroke="#1DA344" stroke-width="3" stroke-linecap="round"/>
  <path d="M 128 210 Q 140 194, 142 180" fill="none" stroke="#1DA344" stroke-width="3" stroke-linecap="round"/>

  <!-- Citrus — upper right, round fruit -->
  <circle cx="268" cy="248" r="34"
    fill="#f0c040" stroke="#1a1a1a" stroke-width="2.4"/>
  <!-- Citrus segment lines -->
  <line x1="268" y1="216" x2="268" y2="282" stroke="#1a1a1a" stroke-width="1.2" opacity="0.4"/>
  <line x1="234" y1="248" x2="302" y2="248" stroke="#1a1a1a" stroke-width="1.2" opacity="0.4"/>
  <line x1="244" y1="224" x2="292" y2="272" stroke="#1a1a1a" stroke-width="1.2" opacity="0.4"/>
  <line x1="292" y1="224" x2="244" y2="272" stroke="#1a1a1a" stroke-width="1.2" opacity="0.4"/>

  <!-- Bok choy / cabbage leaf — center-left, ink outline -->
  <path d="M 152 330 Q 132 308, 138 282 Q 152 266, 168 278 Q 182 290, 180 316 Q 178 340, 160 354 Z"
    fill="#cfe3d0" stroke="#1a1a1a" stroke-width="2.2"/>
  <!-- Leaf midrib -->
  <path d="M 158 352 Q 162 320, 156 282" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

  <!-- Fish silhouette — lower right, simple flat shape -->
  <path d="M 220 370 Q 248 352, 290 356 Q 318 360, 326 376 Q 318 392, 290 396 Q 248 400, 220 382 Z"
    fill="#1a1a1a" opacity="0.75"/>
  <!-- Fish tail fin -->
  <path d="M 220 370 L 200 356 L 204 376 L 200 396 L 220 382 Z"
    fill="#1a1a1a" opacity="0.75"/>
  <!-- Fish eye -->
  <circle cx="308" cy="376" r="5" fill="#f0dcc4"/>

</svg>
